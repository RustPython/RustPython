on:
  push:
    branches: [main]
  pull_request:
    types: [unlabeled, opened, synchronize, reopened]
  merge_group:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

name: CodSpeed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CI: true
  # Must share its major version with the `codspeed-criterion-compat` crate
  # in Cargo.toml, which writes the raw walltime results this tool aggregates.
  CARGO_CODSPEED_VERSION: v5.0.3

jobs:
  # The benchmark executables are compiled on a hosted runner, so the Macro
  # runner's time goes to measuring, not to building.
  build:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip:ci') }}
    name: Build the benchmark executables
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CACHE_PATHS: |
        # https://doc.rust-lang.org/cargo/guide/cargo-home.html#caching-the-cargo-home-in-ci
        ~/.cargo/.crates2.json
        ~/.cargo/.crates.toml
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        target/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: codspeed-v3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: codspeed-v3-
        continue-on-error: true

      - name: Install cargo-codspeed
        run: .github/scripts/install-cargo-codspeed.sh "${CARGO_CODSPEED_VERSION}"

      # `benches/execution.rs` and `benches/microbenchmarks.rs` are not built:
      # they link CPython through pyo3 for a local comparison, and an executable
      # linked against one machine's libpython cannot be moved to the Macro
      # runner that executes it.
      - name: Build the benchmark targets
        run: >-
          cargo codspeed build --locked --measurement-mode walltime
          -p rustpython --bench pyperformance
          -p rustpython-sre_engine

      - name: Save cache
        if: ${{ github.ref == 'refs/heads/main' }} # only save on main
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: codspeed-v3-${{ hashFiles('**/Cargo.lock') }}
        continue-on-error: true

      - name: Upload the benchmark executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-benchmarks-${{ github.run_id }}
          path: target/codspeed/walltime/
          retention-days: 1
          if-no-files-found: error

  run:
    name: Run the benchmarks
    needs: build
    # A CodSpeed Macro runner: dedicated hardware, so wall time is comparable
    # between runs without any environment matching.
    runs-on: codspeed-macro
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # for OpenID Connect authentication with CodSpeed
    steps:
      # The executables read `Lib/` and `benches/pyperformance/` at run time,
      # and `cargo codspeed run` reads the workspace metadata.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-codspeed
        run: .github/scripts/install-cargo-codspeed.sh "${CARGO_CODSPEED_VERSION}"

      - name: Download the benchmark executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codspeed-benchmarks-${{ github.run_id }}
          path: target/codspeed/walltime/

      - name: Restore the executable bits
        # Artifacts are zipped and come back without their permission bits.
        run: find target/codspeed/walltime -type f -exec chmod +x {} +

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: walltime
          run: cargo codspeed run -p rustpython --bench pyperformance -p rustpython-sre_engine
