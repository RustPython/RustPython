name: Lib Dependencies Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "Lib/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check_deps:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use base branch for scripts (security: don't run PR code with elevated permissions)
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$PR_HEAD_SHA"

      - name: Checkout PR Lib files
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Checkout only Lib/ directory from PR head for accurate comparison
          git checkout "$PR_HEAD_SHA" -- Lib/

      - name: Get target CPython version
        id: cpython-version
        run: |
          version=$(cat .python-version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout CPython
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: python/cpython
          path: cpython
          ref: "v${{ steps.cpython-version.outputs.version }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Get changed Lib files
        id: all-changed-files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Get the list of changed files under Lib/
          {
            echo 'changed<<EOF'

            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- 'Lib/*.py' 'Lib/**/*.py'

            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Parse changed files
        id: changed-files
        run: |
          from os import environ

          files = environ["FILES"]
          modules = set()
          for file in files.splitlines():
            file = file.strip()

            if file.startswith("Lib/test/"):
              # Test files:
              # Lib/test/test_pydoc.py -> test_pydoc
              # Lib/test/test_pydoc/foo.py -> test_pydoc
              module = file.removeprefix("Lib/test/").split("/")[0]
              if not module.startswith("test_"):
                continue
            else:
              # Lib files:
              # Lib/foo.py -> foo
              # Lib/foo/__init__.py -> foo
              module = file.removeprefix("Lib/").split("/")[0]
            
            module = module.split(".")[0]
            modules.add(module)

          print(f"{modules=}")
          output = " ".join(sorted(modules))
          output_file = environ["GITHUB_OUTPUT"]
          with open(output_file, mode="a", encoding="utf-8") as fd:
            fd.write(f"modules={output}\n")
        env:
          FILES: ${{ steps.all-changed-files.outputs.changed }}
        shell: python

      - name: Setup Python
        if: steps.changed-files.outputs.modules != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Run deps check
        if: steps.changed-files.outputs.modules != ''
        run: |
          # Run deps for all modules at once
          python scripts/update_lib deps "${MODULES}" --depth 2 > "$RUNNER_TEMP/lib-deps-report.md" 2>&1 || true
        env:
          MODULES: ${{ steps.changed-files.outputs.modules }}

      - name: Prepare dependency report
        if: steps.changed-files.outputs.modules != ''
        id: deps-comment
        shell: python
        run: |
          from os import environ
          from pathlib import Path

          report_path = Path(environ["RUNNER_TEMP"]) / "lib-deps-report.md"
          report = report_path.read_text(encoding="utf-8")
          if report:
              heading = "## 📦 Library Dependencies\n\n"
              body = (
                  heading
                  + "The following Lib/ modules were modified. Here are their dependencies:\n\n"
                  + report
                  + "\n\n**Legend:**\n"
                  + "- `[+]` path exists in CPython\n"
                  + "- `[x]` up-to-date, `[ ]` outdated\n"
              )
              report_path.write_text(body, encoding="utf-8")
              body_size = len(body.encode("utf-8"))
              run_url = (
                  f"{environ['GITHUB_SERVER_URL']}/{environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{environ['GITHUB_RUN_ID']}"
              )

              # Job summaries have a 1 MiB limit; keep larger reports as artifacts.
              needs_artifact = body_size > 1024 * 1024
              summary = body
              if needs_artifact:
                  summary = (
                      heading
                      + "The dependency report exceeds the job summary limit. "
                      + "Download the full report from this run's `lib-deps-report` artifact.\n"
                  )
              with open(environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fd:
                  fd.write(summary)

              # Leave room for the action's marker, counting UTF-8 bytes, not characters.
              comment = body
              if body_size >= 60000:
                  comment = (
                      heading
                      + "The dependency report is too large for a pull request comment. "
                      + f"[View the full report in the workflow run]({run_url}#summary).\n"
                  )
              comment_path = Path(environ["RUNNER_TEMP"]) / "lib-deps-comment.md"
              comment_path.write_text(comment, encoding="utf-8")
              with open(environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fd:
                  fd.write("has_report=true\n")
                  fd.write(f"needs_artifact={str(needs_artifact).lower()}\n")

      - name: Upload oversized dependency report
        if: steps.deps-comment.outputs.needs_artifact == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lib-deps-report
          path: ${{ runner.temp }}/lib-deps-report.md
          if-no-files-found: error

      - name: Post comment
        if: steps.deps-comment.outputs.has_report == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: lib-deps-check
          number: ${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/lib-deps-comment.md

      - name: Remove comment if no Lib changes
        if: steps.changed-files.outputs.modules == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: lib-deps-check
          number: ${{ github.event.pull_request.number }}
          delete: true
