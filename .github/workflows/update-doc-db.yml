name: Update doc DB

permissions: {}

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Target python version to generate doc db for
        type: string
        default: "3.15.0"
      base-ref:
        description: Base branch to create the update branch from
        type: string
        default: "main"
      artifact-only:
        description: Generate artifacts from main without pushing or creating a PR
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Validate artifact-only source
        if: ${{ inputs.artifact-only }}
        env:
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$BASE_REF" != "main" ]; then
            echo 'Artifact-only generation requires the main workflow ref and main base.' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            crates/doc

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Generate docs
        run: python crates/doc/generate.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-db-${{ inputs.python-version }}-${{ matrix.os }}
          path: "crates/doc/generated/*.json"
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  merge:
    runs-on: ubuntu-latest
    needs: generate
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.artifact-only && github.sha || inputs.base-ref }}

      - name: Record merge base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download generated doc DBs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "doc-db-${{ inputs.python-version }}-**"
          path: crates/doc/generated/
          merge-multiple: true

      - name: Transform JSON
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          # Merge all artifacts
          jq -s "add" --sort-keys crates/doc/generated/*.json > crates/doc/generated/merged.json

          # Format merged json as a sorted const slice
          jq -r 'to_entries[] | "    (\(.key | @json), \(.value | @json)),"' crates/doc/generated/merged.json > crates/doc/generated/raw_entries.txt

          OUTPUT_FILE='crates/doc/src/data.inc.rs'

          # shellcheck disable=SC2016
          {
            echo '// This file was auto-generated by `.github/workflows/update-doc-db.yml`.'
            echo "// CPython version: ${PYTHON_VERSION}"
            echo '// spell-checker: disable'
            echo ''
            echo '#[rustfmt::skip]'
            echo 'pub const DB: &[(&str, &str)] = &['
            cat crates/doc/generated/raw_entries.txt
            echo '];'
          } > "$OUTPUT_FILE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-db-${{ inputs.python-version }}
          path: "crates/doc/src/data.inc.rs"
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    if: ${{ !inputs.artifact-only }}
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ needs.merge.outputs.base-sha }}

      - name: Create update branch
        run: git switch -c "update-doc-${PYTHON_VERSION}"
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}

      - name: Download merged doc DB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: doc-db-${{ inputs.python-version }}
          path: crates/doc/src/

      - name: Commit, push and create PR
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          BASE_REF: ${{ inputs.base-ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add crates/doc/src/data.inc.rs
            git commit -m "Update doc DB for CPython ${PYTHON_VERSION}"
            git push -u origin HEAD
            gh pr create \
              --base "${BASE_REF}" \
              --title "Update doc DB for CPython ${PYTHON_VERSION}" \
              --body "Auto-generated by update-doc-db workflow."
          fi
