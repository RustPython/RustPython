[package]
name = "rustpython_wasm"
description = "A Python-3 (CPython >= 3.5.0) Interpreter written in Rust, compiled to WASM"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freeze-stdlib"]
freeze-stdlib = ["rustpython-vm/freeze-stdlib", "rustpython-pylib/freeze-stdlib", "rustpython-stdlib", "rustpython-stdlib/ssl"]
no-start-func = []

[dependencies]
rustpython-common = { workspace = true }
rustpython-pylib = { workspace = true, optional = true }
rustpython-stdlib = { workspace = true, default-features = false, optional = true }
ruff_text_size = { workspace = true }
# make sure no threading! otherwise wasm build will fail
rustpython-vm = { workspace = true, features = ["compiler", "encodings", "serde", "wasmbind"] }

serde = { workspace = true }
wasm-bindgen = { workspace = true }

console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "Window",
    "Headers",
    "Request",
    "RequestInit",
    "Response"
] }

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
rustls = { workspace = true, default-features = false, features = ["std", "tls12", "custom-provider"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc", "std", "web"] }
rustls-rustcrypto = "0.0.2-alpha"
rustpython-host_env = { workspace = true, features = ["ssl"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false#["-O1"]

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["serde", "getrandom", "rustls-pki-types"]
