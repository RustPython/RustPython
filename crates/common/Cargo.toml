[package]
name = "rustpython-common"
description = "General python functions and algorithms for use in RustPython"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
binascii = ["dep:base64", "dep:crc32fast"]
cjk-codecs = []
inet = ["std"]
json = ["dep:memchr", "std"]
std = []
threading = ["parking_lot", "std"]
wasm_js = ["getrandom/wasm_js"]

[dependencies]
rustpython-literal = { workspace = true }
rustpython-unicode = { workspace = true }
rustpython-wtf8 = { workspace = true }

ascii = { workspace = true }
base64 = { workspace = true, optional = true }
bitflags = { workspace = true }
crc32fast = { workspace = true, optional = true }
getrandom = { workspace = true }
itertools = { workspace = true }
libc = { workspace = true }
malachite-bigint = { workspace = true }
malachite-q = { workspace = true }
malachite-base = { workspace = true }
memchr = { workspace = true, optional = true }
num-traits = { workspace = true }
parking_lot = { workspace = true, optional = true }
radium = { workspace = true }

lock_api = { workspace = true }
siphasher = { workspace = true }
num-complex = { workspace = true }

[lints]
workspace = true
