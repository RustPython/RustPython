# Source-derived standalone manifest for the exact RustPython Ruff fork.
# The upstream manifest is preserved in Cargo.toml.orig.

[package]
description = "Unofficial fork for RustPython"
name = "rustpython-ruff_python_parser"
version = "0.17.1"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>", "RustPython Team"]
edition = "2024"
rust-version = "1.97"
homepage = "https://docs.astral.sh/ruff"
documentation = "https://docs.astral.sh/ruff"
repository = "https://github.com/astral-sh/ruff"
license = "MIT"

[lib]
name = "ruff_python_parser"

[features]
python315-diagnostics = []

[dependencies]
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.17.1", git = "https://github.com/RustPython/ruff.git", rev = "9290a8849542134d83f77e9360e7f0b93897fd93", features = ["get-size"] }
ruff_python_trivia = { package = "rustpython-ruff_python_trivia", version = "0.17.1", git = "https://github.com/RustPython/ruff.git", rev = "9290a8849542134d83f77e9360e7f0b93897fd93" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.17.1", git = "https://github.com/RustPython/ruff.git", rev = "9290a8849542134d83f77e9360e7f0b93897fd93", features = ["get-size"] }
ruff_unicode_names2 = { version = "0.0.18", git = "https://github.com/RustPython/ruff.git", rev = "9290a8849542134d83f77e9360e7f0b93897fd93" }
bitflags = { version = "2.5.0", default-features = false }
bstr = { version = "1.9.1", default-features = false, features = ["std"] }
drop_bomb = { version = "0.1.5", default-features = false }
get-size2 = { version = "0.11.0", default-features = false, features = ["compact-str", "derive", "hashbrown", "ordermap", "smallvec", "std", "thin-vec"] }
hashbrown = { version = "0.17.0", default-features = false, features = ["inline-more"] }
icu_properties = { version = "2.1.2", default-features = false, features = ["compiled_data"] }
memchr = { version = "2.7.1", default-features = false, features = ["std"] }
rustc-hash = { version = "2.0.0", default-features = false, features = ["std"] }
static_assertions = { version = "1.1.0", default-features = false }
stacker = { version = "0.1.24", default-features = false }
thin-vec = { version = "0.2.14", default-features = false, features = ["std"] }
unicode-ident = { version = "1.0.12", default-features = false }
unicode-normalization = { version = "0.1.23", default-features = false, features = ["std"] }

[dev-dependencies]
ruff_annotate_snippets = { git = "https://github.com/RustPython/ruff.git", rev = "9290a8849542134d83f77e9360e7f0b93897fd93" }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.17.1", git = "https://github.com/RustPython/ruff.git", rev = "9290a8849542134d83f77e9360e7f0b93897fd93", features = ["serde"] }
ruff_source_file = { package = "rustpython-ruff_source_file", version = "0.17.1", git = "https://github.com/RustPython/ruff.git", rev = "9290a8849542134d83f77e9360e7f0b93897fd93" }
anyhow = { version = "1.0.80", default-features = false, features = ["std"] }
datatest-stable = { version = "0.3.3", default-features = false }
insta = { version = "1.35.1", default-features = false, features = ["colors"] }
itertools = { version = "0.15.0", default-features = false, features = ["use_std"] }
serde = { version = "1.0.197", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.113", default-features = false, features = ["std"] }
walkdir = { version = "2.3.2", default-features = false }

[[test]]
name = "fixtures"
harness = false

[lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(codspeed)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
disallowed_methods = "allow"
assert_is_empty = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
nonstandard_macro_braces = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_lines = "allow"
collapsible_match = "allow"
needless_continue = "allow"
unnecessary_debug_formatting = "allow"
needless_raw_string_hashes = "allow"
ignore_without_reason = "allow"
iter_over_hash_type = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
if_not_else = "allow"

[workspace]
